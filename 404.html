<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到頁面 — 戴文軒 Tai Man Hin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  @font-face {
    font-family: "Noto Serif TC";
    src: url("/assets/fonts/noto-serif-tc.woff2") format("woff2");
    font-weight: 200 900;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    background: #0a0a0c;
    color: #ece6da;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  .nf-code {
    font-family: "Cormorant Garamond", "Times New Roman", serif;
    font-size: clamp(5rem, 16vw, 10rem);
    line-height: 1;
    color: #c8a15f;
    letter-spacing: 0.08em;
    font-style: italic;
  }
  .nf-title {
    font-family: "Noto Serif TC", serif;
    font-size: clamp(1.2rem, 3vw, 1.7rem);
    letter-spacing: 0.4em;
    padding-left: 0.4em;
    margin: 26px 0 14px;
    font-weight: 500;
  }
  .nf-text {
    color: rgba(236, 230, 218, 0.62);
    font-size: 0.9rem;
    letter-spacing: 0.14em;
    margin: 0 0 44px;
  }
  .nf-btn {
    display: inline-block;
    padding: 15px 44px;
    border: 1px solid rgba(200, 161, 95, 0.34);
    font-size: 0.82rem;
    letter-spacing: 0.38em;
    padding-left: calc(44px + 0.38em);
    color: #ece6da;
    text-decoration: none;
    transition: color 0.5s ease, border-color 0.5s ease, background 0.5s ease;
  }
  .nf-btn:hover {
    color: #14100a;
    background: #c8a15f;
    border-color: #c8a15f;
  }
</style>
</head>
<body>
  <div>
    <div class="nf-code">404</div>
    <h1 class="nf-title">迷路了</h1>
    <p class="nf-text">你搵緊嘅頁面唔存在,或者已經移咗位。</p>
    <a class="nf-btn" href="/">回到首頁</a>
  </div>
</body>
</html>
